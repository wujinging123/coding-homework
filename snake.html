<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;flex-direction:column;align-items:center;background:#111;color:#fff;padding:20px}
#game{border:2px solid #fff}
.info{margin-bottom:10px;font-size:18px}
button{padding:6px 12px;margin-left:10px;cursor:pointer}
</style>
</head>
<body>
<div class="info">得分：<span id="score">0</span> 最高分：<span id="high">0</span>
<button id="reset">重置游戏</button>
</div>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('score');
const highText = document.getElementById('high');
const resetBtn = document.getElementById('reset');

const size = 20;
const count = canvas.width / size;

let snake = [{x:10,y:10}];
let dx = 1, dy = 0;
let food = {};
let score = 0;
let highScore = localStorage.getItem('snakeHigh') || 0;
highText.innerText = highScore;

function createFood(){
    return {
        x:Math.floor(Math.random()*count),
        y:Math.floor(Math.random()*count)
    }
}
food = createFood();

document.addEventListener('keydown',e=>{
    if(e.key === 'ArrowUp' && dy!==1){dx=0;dy=-1}
    if(e.key === 'ArrowDown' && dy!==-1){dx=0;dy=1}
    if(e.key === 'ArrowLeft' && dx!==1){dx=-1;dy=0}
    if(e.key === 'ArrowRight' && dx!==-1){dx=1;dy=0}
})

function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#0f0';
    snake.forEach(seg=>ctx.fillRect(seg.x*size,seg.y*size,size-1,size-1));
    ctx.fillStyle='#f22';
    ctx.fillRect(food.x*size,food.y*size,size-1,size-1);
}

function update(){
    const head = {x:snake[0].x+dx, y:snake[0].y+dy};
    if(head.x<0||head.y<0||head.x>=count||head.y>=count) return gameOver();
    for(let seg of snake){
        if(seg.x===head.x && seg.y===head.y) return gameOver();
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
        score +=10;
        scoreText.innerText = score;
        food = createFood();
    }else{
        snake.pop();
    }
}

function gameOver(){
    alert("游戏结束！得分："+score);
    if(score > highScore){
        highScore = score;
        localStorage.setItem('snakeHigh',highScore);
        highText.innerText = highScore;
    }
    resetGame();
}

function resetGame(){
    snake = [{x:10,y:10}];
    dx=1;dy=0;
    score=0;
    scoreText.innerText=0;
    food=createFood();
}
resetBtn.onclick = resetGame;

function loop(){
    update();
    draw();
}
setInterval(loop,120);
</script>
</body>
</html>
