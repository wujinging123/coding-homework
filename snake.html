<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box}
body{background:#111;color:#fff;text-align:center;font-family:Arial}
#canvas{background:#000;border:2px solid #444}
</style>
</head>
<body>
<div>得分：<span id="score">0</span> &nbsp;&nbsp;最高分：<span id="high">0</span></div>
<button id="reset">重置游戏</button>
<button id="autoBtn">开启AI自动</button>
<canvas id="canvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const highText = document.getElementById("high");
const resetBtn = document.getElementById("reset");
const autoBtn = document.getElementById("autoBtn");

const size = 20;
const count = canvas.width / size;

let snake = [{x:10, y:10}];
let dx = 1, dy = 0;
let food = {};
let score = 0;
let highScore = Number(localStorage.getItem("snakeHigh")) || 0;
highText.innerText = highScore;
let autoMode = false;

// 生成食物
function createFood(){
    return {
        x:Math.floor(Math.random()*count),
        y:Math.floor(Math.random()*count)
    }
}
food = createFood();

// AI自动寻路核心逻辑（简单易懂）
function aiControl(){
    const head = snake[0];
    // 优先朝着食物坐标移动
    if(head.x < food.x) {dx=1;dy=0;}
    else if(head.x > food.x) {dx=-1;dy=0;}
    else if(head.y < food.y) {dx=0;dy=1;}
    else if(head.y > food.y) {dx=0;dy=-1;}
}

function draw(){
    // 黑色背景
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 画蛇
    ctx.fillStyle="#39ff14";
    snake.forEach(seg=>{
        ctx.fillRect(seg.x*size, seg.y*size, size-1, size-1);
    })
    // 画食物红色
    ctx.fillStyle="#ff3333";
    ctx.fillRect(food.x*size, food.y*size, size-1, size-1);
}

function update(){
    if(autoMode) aiControl();
    const head = {x:snake[0].x+dx, y:snake[0].y+dy};

    //撞墙判断
    if(head.x<0||head.x>=count||head.y<0||head.y>=count){
        gameOver();
        return;
    }
    //撞到自己
    for(let seg of snake){
        if(seg.x===head.x && seg.y===head.y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);
    //吃到食物
    if(head.x===food.x && head.y===food.y){
        score +=10;
        scoreText.innerText=score;
        food=createFood();
    }else{
        snake.pop();
    }
    draw();
}

function gameOver(){
    alert("游戏结束，得分："+score);
    if(score>highScore){
        highScore=score;
        localStorage.setItem("snakeHigh",highScore);
        highText.innerText=highScore;
    }
    resetGame();
}

function resetGame(){
    snake=[{x:10,y:10}];
    dx=1;dy=0;
    score=0;
    scoreText.innerText=0;
    food=createFood();
}

//键盘手动控制
document.addEventListener("keydown",e=>{
    if(autoMode) return;
    switch(e.key){
        case "ArrowUp": if(dy!==1){dx=0;dy=-1;}break;
        case "ArrowDown": if(dy!==-1){dx=0;dy=1;}break;
        case "ArrowLeft": if(dx!==1){dx=-1;dy=0;}break;
        case "ArrowRight": if(dx!==-1){dx=1;dy=0;}break;
    }
})

resetBtn.onclick = resetGame;
autoBtn.onclick = ()=>{
    autoMode = !autoMode;
    autoBtn.innerText = autoMode ? "关闭AI自动" : "开启AI自动";
}

draw();
setInterval(update,120);
</script>
</body>
</html>
